name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (contracts, agent, api, integrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No `|| echo` fallbacks any more. Those were scaffolding from the week the
      # lane packages did not exist yet; all four install cleanly now, and a
      # swallowed install failure means every test below silently tests nothing.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./contracts/python
          pip install -e ./integrations
          pip install -e "./agent[dev]"
          pip install -e "./api[dev]"
          pip install ruff pytest

      - name: Lint
        run: ruff check contracts/python agent api integrations

      - name: Contracts import cleanly
        run: python -c "import quiet_hours_contracts as c; print('contract', c.CONTRACT_VERSION)"

      # **`|| true` removed deliberately.** With it, CI reported success no matter
      # what failed, so "main is green" was worth nothing and the submission
      # checklist's `make test` line could be ticked on a lie. All three suites
      # pass (214 + 43 + 50 = 307 as of 11 Sept); if one breaks, this must say so.
      #
      # Run separately because `agent/tests` and `integrations/tests` are both
      # packages named `tests`: one pytest invocation over both fails collection
      # with a ModuleNotFoundError that looks like a real failure and is not.
      - name: Test
        run: |
          pytest agent/tests -q
          pytest api/tests -q
          pytest integrations/tests -q

  web:
    name: Web (typecheck, lint, both builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and lint
        working-directory: web
        run: npm test

      # **Both builds, because they are different builds.** The static export is
      # what GitHub Pages serves and it can break on its own — an `output: export`
      # violation, or a page that stops being client-rendered — while the default
      # build stays green. Catching that here rather than in the Pages workflow
      # means a PR fails, not the published site.
      - name: Build (default)
        working-directory: web
        run: npm run build

      - name: Build (static export)
        working-directory: web
        env:
          NEXT_PUBLIC_STATIC_DEMO: '1'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A contract change must be its own PR
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          TOUCHES_CONTRACTS=$(echo "$CHANGED" | grep -c '^contracts/' || true)
          TOUCHES_OTHER=$(echo "$CHANGED" | grep -vc -e '^contracts/' -e '^docs/CONTRACTS.md' || true)
          TITLE="${{ github.event.pull_request.title }}"
          if [ "$TOUCHES_CONTRACTS" -gt 0 ]; then
            case "$TITLE" in
              contract:*) ;;
              *) echo "::error::This PR changes /contracts. It must be titled 'contract: ...' and touch nothing else. See docs/CONTRACTS.md."; exit 1 ;;
            esac
            if [ "$TOUCHES_OTHER" -gt 0 ]; then
              echo "::error::A contract: PR must touch only /contracts and docs/CONTRACTS.md."
              echo "$CHANGED"
              exit 1
            fi
          fi

      - name: The live email provider must have no send path
        run: |
          if grep -rniE "def +send(_message|_mail|_email)?\b" integrations/quiet_hours_integrations/live/ 2>/dev/null; then
            echo "::error::A send method appeared in a live provider. Quiet Hours creates drafts only - see AGENTS.md."
            exit 1
          fi
          echo "ok - drafts only"

      - name: No obvious secrets
        run: |
          if git grep -nEI "(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" -- . ':!*.md'; then
            echo "::error::Possible credential committed."
            exit 1
          fi
          echo "ok"

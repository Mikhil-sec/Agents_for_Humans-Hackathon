name: Pages

# The hosted demo: https://mikhil-sec.github.io/Agents_for_Humans-Hackathon/
#
# Builds `/web` as a static export and publishes it to GitHub Pages. There is no
# backend behind it and there are no secrets in it — `web/lib/staticBackend.ts`
# serves the committed fixture set from inside the bundle, so the deployed site
# needs no AWS account, no credentials and no Bedrock access. That is the same
# guarantee `make demo` makes from a clean clone, which is the rule in AGENTS.md
# that actually matters.
#
# Before this runs for the first time, Pages must be enabled on the repository
# with **Source: GitHub Actions** (Settings -> Pages). Without that the deploy
# step fails with a 404 on the Pages API, which reads like a permissions problem
# and is not one.

on:
  push:
    branches: [main]
    # Only rebuild when something the site is actually made of changes. The
    # fixture set is in this list because it *is* the site's data.
    paths:
      - 'web/**'
      - 'fixtures/**'
      - 'contracts/typescript/**'
      - '.github/workflows/pages.yml'
  # So the site can be republished without an empty commit.
  workflow_dispatch:

# Read the repo, and mint the token the deploy step exchanges for Pages access.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` so a queued run finishes
# rather than leaving the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck and lint
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_STATIC_DEMO: '1'
          # A project Pages site is served from /<repo>/, not the domain root.
          # Derived from the repository name so a fork publishes correctly
          # without editing this file.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Stop Pages running Jekyll over the export
        # Without this, Pages hands the output to Jekyll, which ignores every
        # directory beginning with an underscore — including `_next`, which is
        # all of the JavaScript and CSS. The symptom is a site that serves
        # unstyled HTML and 404s every asset, with nothing in the build log.
        run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

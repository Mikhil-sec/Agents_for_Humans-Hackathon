[project]
name = "quiet-hours-agent"
version = "0.1.0"
description = "Quiet Hours - the Strands agent (Lane A)"
requires-python = ">=3.11"
dependencies = [
    "quiet-hours-contracts",
    "quiet-hours-integrations",
    "strands-agents>=1.42",
    "strands-agents-tools",
    "bedrock-agentcore",
    "boto3>=1.34",
    "pydantic>=2.7",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quiet_hours_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

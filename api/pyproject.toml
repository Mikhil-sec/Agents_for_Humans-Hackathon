[project]
name = "quiet-hours-api"
version = "0.1.0"
description = "Quiet Hours - FastAPI backend (Lane B)"
requires-python = ">=3.11"
dependencies = [
    "quiet-hours-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "boto3>=1.34",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
